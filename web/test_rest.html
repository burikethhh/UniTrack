<!DOCTYPE html>
<html>
<head>
  <title>Firestore REST API Test</title>
  <style>
    body { font-family: monospace; margin: 20px; background: #1a1a1a; color: #0f0; }
    .pass { color: #0f0; }
    .fail { color: #f00; }
    .info { color: #ff0; }
    #log { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>Firestore REST API Test (bypasses SDK)</h2>
  <p>This tests if your browser can reach Firestore via plain HTTP.</p>
  <hr>
  <div id="log"></div>

  <script>
    const logEl = document.getElementById('log');
    function log(msg, cls) {
      const span = document.createElement('span');
      span.className = cls || '';
      span.textContent = msg + '\n';
      logEl.appendChild(span);
    }

    async function runTests() {
      const baseUrl = 'https://firestore.googleapis.com/v1/projects/isksulars-track/databases/(default)/documents';

      // Test 1: Check if domain resolves
      log('Test 1: Domain resolution check...', 'info');
      try {
        await fetch('https://firestore.googleapis.com/', { method: 'HEAD', mode: 'no-cors' });
        log('  PASS: firestore.googleapis.com resolves', 'pass');
      } catch (e) {
        log(`  FAIL: ${e.message}`, 'fail');
      }

      // Test 2: OPTIONS preflight (CORS check)
      log('\nTest 2: CORS preflight (OPTIONS)...', 'info');
      try {
        const resp = await fetch(`${baseUrl}/test`, { method: 'OPTIONS' });
        log(`  Status: ${resp.status} (${resp.statusText})`, resp.ok ? 'pass' : 'info');
      } catch (e) {
        log(`  FAIL: ${e.message}`, 'fail');
        // Try a different approach - simple GET with no-cors
        log('  Trying no-cors mode...', 'info');
        try {
          await fetch('https://firestore.googleapis.com/', { method: 'GET', mode: 'no-cors' });
          log('  no-cors: server reachable', 'pass');
        } catch (e2) {
          log(`  no-cors also failed: ${e2.message}`, 'fail');
        }
      }

      // Test 3: Simple GET to Firestore
      log('\nTest 3: GET to Firestore v1 endpoint...', 'info');
      const start3 = Date.now();
      try {
        const resp = await fetch(`${baseUrl}/_test_`, {
          method: 'GET',
          headers: { 'Accept': 'application/json' },
        });
        const elapsed = Date.now() - start3;
        log(`  Response: ${resp.status} (${elapsed}ms)`, resp.status < 500 ? 'pass' : 'info');
        const text = await resp.text();
        log(`  Body: ${text.substring(0, 200)}`, 'info');
      } catch (e) {
        const elapsed = Date.now() - start3;
        log(`  FAIL after ${elapsed}ms: ${e.message}`, 'fail');
        log(`  Error name: ${e.name}`, 'fail');
      }

      // Test 4: Is Firebase Auth reachable? (for comparison)
      log('\nTest 4: Firebase Auth endpoint (control test)...', 'info');
      const start4 = Date.now();
      try {
        const resp = await fetch('https://identitytoolkit.googleapis.com/', { method: 'GET' });
        const elapsed = Date.now() - start4;
        log(`  PASS: ${resp.status} (${elapsed}ms)`, 'pass');
      } catch (e) {
        const elapsed = Date.now() - start4;
        log(`  FAIL after ${elapsed}ms: ${e.message}`, 'fail');
      }

      // Test 5: HTTPS to a non-Firebase Google service for comparison
      log('\nTest 5: GET google.com (control test)...', 'info');
      const start5 = Date.now();
      try {
        const resp = await fetch('https://www.google.com/', { method: 'HEAD' });
        const elapsed = Date.now() - start5;
        log(`  PASS: ${resp.status} (${elapsed}ms)`, 'pass');
      } catch (e) {
        const elapsed = Date.now() - start5;
        log(`  FAIL after ${elapsed}ms: ${e.message}`, 'fail');
      }

      // Test 6: WebSocket-like approach with EventSource
      log('\nTest 6: EventSource (SSE) to any Firebase endpoint...', 'info');
      try {
        const es = new EventSource('https://firestore.googleapis.com/');
        const timeout = setTimeout(() => {
          es.close();
          log('  TIMEOUT after 5s (EventSource hung)', 'fail');
        }, 5000);
        const nextElapsed = Date.now() - Date.now();
        
        es.onerror = () => {
          clearTimeout(timeout);
          const elapsed = Date.now() - start3;
          log(`  EventSource error after ~${elapsed}ms`, 'info');
          es.close();
        };
        es.onmessage = () => {
          clearTimeout(timeout);
          log('  EventSource received message!', 'pass');
          es.close();
        };
        log('  EventSource connection opened, waiting...', 'info');
      } catch (e) {
        log(`  FAIL: ${e.message}`, 'fail');
      }

      log('\n--- Tests complete ---', 'info');
      log('If Test 3 fails but Test 4/5 pass, Firestore REST is blocked.', 'info');
      log('If ALL fail, your network/firewall blocks Google APIs.', 'info');
    }

    runTests();
  </script>
</body>
</html>
