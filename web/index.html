  <!-- MapLibre GL JS for web map support (loaded synchronously before Flutter) -->
  <script src="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script>
    // Set worker URL immediately — MapLibre is already loaded (synchronous)
    if (typeof maplibregl !== 'undefined') {
      maplibregl.workerUrl = 'https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl-csp-worker.js';

      // ── Suppress MapLibre tile-load errors that flood the console ──
      // MapLibre fires an 'error' event for every failed tile request
      // (404, 403, network timeouts, etc.).  During zoom this creates
      // a "rain" of console errors.  We patch Map.prototype.fire to
      // silently swallow tile/source errors while still letting real
      // application errors through.
      (function() {
        var _origFire = maplibregl.Map.prototype.fire;
        maplibregl.Map.prototype.fire = function(type, properties) {
          if (type === 'error' && properties) {
            var err = properties.error || properties;
            var msg = (err && err.message) ? err.message : String(err);
            // Swallow tile/source HTTP errors (404, 403, network)
            if (msg.indexOf('AJAXError') !== -1 ||
                msg.indexOf('Error loading') !== -1 ||
                msg.indexOf('tile') !== -1 ||
                msg.indexOf('source') !== -1 ||
                (err && (err.status === 404 || err.status === 403))) {
              return this; // swallow silently
            }
          }
          return _origFire.apply(this, arguments);
        };
      })();
    }
  </script>

  <script src="bg_tracking.js" defer></script>

  <!-- Catch unhandled Promise rejections from MapLibre/maplibre_gl plugin.
       The Flutter maplibre_gl plugin fires async JS calls to add/remove
       annotations.  If a style swap happens mid-flight, the JS side
       rejects with a TypeError that Dart's try-catch cannot catch.
       We suppress these harmless race-condition errors here. -->
  <script>
    window.addEventListener('unhandledrejection', function(event) {
      var reason = event.reason;
      if (reason instanceof TypeError && reason.message) {
        // "Cannot set properties of undefined (setting 'XXXX_N')"
        // "Cannot read properties of undefined (reading 'XXXX')"
        // These are MapLibre annotation-manager errors during style transitions.
        if (/Cannot (set|read) properties of (undefined|null)/.test(reason.message)) {
          event.preventDefault();
          return;
        }
      }
    });
  </script>

  <style>
    /* ===== Global Web Fixes ===== */
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none; /* Prevent iOS Safari bounce */
      -webkit-overflow-scrolling: touch;
      -webkit-tap-highlight-color: transparent;
      /* Prevent text selection of UI elements */
      -webkit-user-select: none;
      user-select: none;
    }

    /* Allow text selection inside inputs/textareas */
    input, textarea, [contenteditable] {
      -webkit-user-select: text;
      user-select: text;
    }

    /* Fix iOS Safari 100vh issue */
    body {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      min-height: 100dvh;
    }
    html { height: -webkit-fill-available; }

    /* Hide scrollbars on the Flutter canvas but keep scroll functionality */
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }

    /* ===== Loading Splash Screen (Radar Sweep) ===== */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 100000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #0a2540 0%, #16213e 50%, #0f3460 100%);
      transition: opacity 0.5s ease-out;
      perspective: 800px;
    }
    #loading.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* 3D gyro wrapper — tilts the whole radar */
    #loading .gyro {
      transform-style: preserve-3d;
      animation: gyro-tilt 6s ease-in-out infinite;
    }
    @keyframes gyro-tilt {
      0%, 100% { transform: rotateX(0deg) rotateZ(0deg); }
      25%      { transform: rotateX(6deg)  rotateZ(2deg); }
      50%      { transform: rotateX(0deg)  rotateZ(0deg); }
      75%      { transform: rotateX(-6deg) rotateZ(-2deg); }
    }

    /* Radar container */
    #loading .radar-wrap {
      position: relative;
      width: 260px; height: 260px;
      display: flex; align-items: center; justify-content: center;
      transform-style: preserve-3d;
    }

    /* Concentric expanding rings (sonar pings) */
    #loading .ring {
      position: absolute;
      width: 260px; height: 260px;
      border: 2px solid rgba(65, 179, 163, 0.25);
      border-radius: 50%;
      opacity: 0;
      animation: ring-expand 3s ease-out infinite;
    }
    #loading .ring:nth-child(1) { animation-delay: 0s; }
    #loading .ring:nth-child(2) { animation-delay: 1s; }
    #loading .ring:nth-child(3) { animation-delay: 2s; }
    @keyframes ring-expand {
      0%   { transform: scale(0.25); opacity: 0; border-color: rgba(65, 179, 163, 0.9); }
      15%  { opacity: 1; }
      100% { transform: scale(1.35); opacity: 0; border-color: rgba(65, 179, 163, 0.03); }
    }

    /* Radar grid + crosshair + intersection dots as SVG */
    #loading .radar-svg {
      position: absolute;
      width: 240px; height: 240px;
      overflow: visible;
    }
    #loading .grid-circle {
      fill: none;
      stroke: rgba(65, 179, 163, 0.28);
      stroke-width: 1.2;
    }
    #loading .crosshair-line {
      stroke: rgba(65, 179, 163, 0.35);
      stroke-width: 1;
      stroke-dasharray: 120;
      stroke-dashoffset: 120;
      animation: crosshair-draw 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    #loading .crosshair-line.cx-h { animation-delay: 0.2s; }
    #loading .crosshair-line.cx-v { animation-delay: 0.35s; }
    @keyframes crosshair-draw {
      from { stroke-dashoffset: 120; }
      to   { stroke-dashoffset: 0; }
    }

    /* Glowing intersection dots */
    #loading .intersection {
      fill: #41B3A3;
      filter: drop-shadow(0 0 4px rgba(65, 179, 163, 0.9));
      opacity: 0;
      animation: dot-glow-in 0.4s ease-out forwards;
    }
    #loading .intersection:nth-child(3) { animation-delay: 0.5s; }
    #loading .intersection:nth-child(4) { animation-delay: 0.55s; }
    #loading .intersection:nth-child(5) { animation-delay: 0.6s; }
    #loading .intersection:nth-child(6) { animation-delay: 0.65s; }
    #loading .intersection:nth-child(7) { animation-delay: 0.7s; }
    #loading .intersection:nth-child(8) { animation-delay: 0.75s; }
    @keyframes dot-glow-in {
      from { opacity: 0; transform: scale(0); }
      to   { opacity: 0.9; transform: scale(1); }
    }
    #loading .intersection.pulse {
      animation: dot-glow-in 0.4s ease-out forwards,
                 dot-pulse 2s ease-in-out 1s infinite;
    }
    @keyframes dot-pulse {
      0%, 100% { opacity: 0.6; }
      50%      { opacity: 1; }
    }

    /* Sweeping radar arc with comet tail */
    #loading .sweep-wrap {
      position: absolute;
      width: 240px; height: 240px;
      animation: sweep-rotate 2.5s linear infinite;
    }
    @keyframes sweep-rotate {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    #loading .sweep {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        rgba(65, 179, 163, 0.0) 0deg,
        rgba(65, 179, 163, 0.0) 240deg,
        rgba(65, 179, 163, 0.05) 300deg,
        rgba(65, 179, 163, 0.25) 345deg,
        rgba(65, 179, 163, 0.7)  358deg,
        rgba(65, 179, 163, 0.0)  360deg
      );
      -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 60%, rgba(0,0,0,0.3) 100%);
              mask-image: radial-gradient(circle, rgba(0,0,0,1) 60%, rgba(0,0,0,0.3) 100%);
      filter: drop-shadow(0 0 8px rgba(65, 179, 163, 0.5));
    }
    #loading .sweep-edge {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        transparent 355deg,
        rgba(133, 220, 186, 0.9) 359deg,
        transparent 360deg
      );
    }

    /* Frosted ring around logo */
    #loading .frosted-ring {
      position: absolute;
      width: 105px; height: 105px;
      border-radius: 50%;
      z-index: 9;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.18);
      -webkit-backdrop-filter: blur(8px);
              backdrop-filter: blur(8px);
      box-shadow:
        0 0 20px rgba(65, 179, 163, 0.25),
        inset 0 0 12px rgba(255, 255, 255, 0.05);
      animation: frost-pulse 3s ease-in-out 1s infinite;
    }
    @keyframes frost-pulse {
      0%, 100% { box-shadow: 0 0 20px rgba(65,179,163,0.25), inset 0 0 12px rgba(255,255,255,0.05); }
      50%      { box-shadow: 0 0 40px rgba(65,179,163,0.5),  inset 0 0 18px rgba(255,255,255,0.1); }
    }

    /* Logo pin drop */
    #loading .logo-pin {
      position: relative;
      width: 80px; height: 80px;
      border-radius: 50%;
      object-fit: contain;
      z-index: 10;
      animation: pin-drop 1s cubic-bezier(0.34, 1.56, 0.64, 1) both,
                 pin-glow 2s ease-in-out 1s infinite;
      filter: drop-shadow(0 0 20px rgba(65, 179, 163, 0.6));
    }
    @keyframes pin-drop {
      0%   { transform: translateY(-120px) scale(0.3); opacity: 0; }
      60%  { transform: translateY(8px) scale(1.1); opacity: 1; }
      80%  { transform: translateY(-4px) scale(0.95); }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes pin-glow {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(65, 179, 163, 0.4)); }
      50%      { filter: drop-shadow(0 0 35px rgba(65, 179, 163, 0.8)); }
    }

    /* Ping dots — radar contacts */
    #loading .ping {
      position: absolute;
      width: 7px; height: 7px;
      border-radius: 50%;
      opacity: 0;
      z-index: 8;
      animation: ping-fade 2.5s ease-out infinite;
    }
    #loading .ping::after {
      content: ''; position: absolute; inset: -4px;
      border-radius: 50%;
      border: 1px solid currentColor;
      opacity: 0.4;
    }
    #loading .ping:nth-child(5) { top: 20%; left: 72%; color: #41B3A3; background: #41B3A3; animation-delay: 1.5s; box-shadow: 0 0 8px #41B3A3; }
    #loading .ping:nth-child(6) { top: 73%; left: 24%; color: #41B3A3; background: #41B3A3; animation-delay: 2.0s; box-shadow: 0 0 8px #41B3A3; }
    #loading .ping:nth-child(7) { top: 34%; left: 16%; color: #E8A87C; background: #E8A87C; animation-delay: 2.4s; box-shadow: 0 0 8px #E8A87C; }
    #loading .ping:nth-child(8) { top: 66%; left: 78%; color: #41B3A3; background: #41B3A3; animation-delay: 2.8s; box-shadow: 0 0 8px #41B3A3; }
    @keyframes ping-fade {
      0%, 100% { opacity: 0; transform: scale(0.6); }
      8%       { opacity: 1; transform: scale(1.6); }
      18%      { opacity: 0.9; transform: scale(1); }
      55%      { opacity: 0.6; transform: scale(1); }
      92%      { opacity: 0.05; transform: scale(1); }
    }

    /* Circular progress ring (SVG) */
    #loading .progress-ring {
      position: absolute;
      width: 240px; height: 240px;
      z-index: 7;
      transform: rotate(-90deg);
      overflow: visible;
    }
    #loading .progress-track {
      fill: none;
      stroke: rgba(65, 179, 163, 0.12);
      stroke-width: 2;
    }
    #loading .progress-bar {
      fill: none;
      stroke: #41B3A3;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 219.9;
      stroke-dashoffset: 219.9;
      filter: drop-shadow(0 0 6px rgba(65, 179, 163, 0.8));
      animation: progress-fill 2s ease-in-out 2s forwards;
    }
    @keyframes progress-fill {
      to { stroke-dashoffset: 0; }
    }

    /* Text block */
    #loading .text-block {
      text-align: center;
      margin-top: 32px;
      opacity: 0;
      animation: text-rise 0.8s ease-out 1.2s both;
    }
    @keyframes text-rise {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    #loading .app-name {
      font-size: 30px; font-weight: 800;
      letter-spacing: 4px;
      margin-bottom: 6px;
      color: #ffffff;
    }
    #loading .app-name .letter {
      display: inline-block;
      transform: translateY(20px);
      animation: letter-rise 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    #loading .app-name .letter:nth-child(1)  { animation-delay: 1.30s; }
    #loading .app-name .letter:nth-child(2)  { animation-delay: 1.35s; }
    #loading .app-name .letter:nth-child(3)  { animation-delay: 1.40s; }
    #loading .app-name .letter:nth-child(4)  { animation-delay: 1.45s; }
    #loading .app-name .letter:nth-child(5)  { animation-delay: 1.50s; }
    #loading .app-name .letter:nth-child(6)  { animation-delay: 1.55s; }
    #loading .app-name .letter:nth-child(7)  { animation-delay: 1.60s; }
    #loading .app-name .letter:nth-child(8)  { animation-delay: 1.65s; }
    #loading .app-name .letter:nth-child(9)  { animation-delay: 1.70s; }
    #loading .app-name .letter:nth-child(10) { animation-delay: 1.75s; }
    #loading .app-name .letter:nth-child(11) { animation-delay: 1.80s; }
    #loading .app-name .letter:nth-child(12) { animation-delay: 1.85s; }
    #loading .app-name .letter:nth-child(13) { animation-delay: 1.90s; }
    #loading .app-name .letter:nth-child(14) { animation-delay: 1.95s; }
    @keyframes letter-rise {
      from { transform: translateY(20px); }
      to   { transform: translateY(0); }
    }

    #loading .app-tagline {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 2px;
    }

    /* Reduce motion accessibility */
    @media (prefers-reduced-motion: reduce) {
      #loading .sweep-wrap, #loading .gyro, #loading .ring, #loading .ping,
      #loading .frosted-ring, #loading .logo-pin, #loading .intersection.pulse {
        animation: none !important;
      }
      #loading .intersection, #loading .crosshair-line,
      #loading .text-block, #loading .progress-bar {
        animation-duration: 0.01s !important;
      }
    }

    /* ===== PWA Install Banner (App Store-style card) ===== */
    @keyframes installCardSpring {
      0%   { transform: translate(-50%, -50%) scale(0.88); opacity: 0; }
      60%  { transform: translate(-50%, -50%) scale(1.02); opacity: 1; }
      80%  { transform: translate(-50%, -50%) scale(0.98); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    @keyframes installCardSpringMobile {
      0%   { transform: translate(-50%, 60px); opacity: 0; }
      60%  { transform: translate(-50%, -6px); opacity: 1; }
      80%  { transform: translate(-50%, 3px); opacity: 1; }
      100% { transform: translate(-50%, 0); opacity: 1; }
    }

      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 18px rgba(0,200,150,0.35);

    }
    #installBanner .install-btn:hover { background: #00b386; }
    #installBanner .install-btn:active { background: #009e75; transform: scale(0.97); }

    #installBanner .install-close {
      background: none;

      transition: color 0.2s;
    }
    #installBanner .install-close:hover { color: rgba(255,255,255,0.7); }
  </style>

<body>

    <div class="text-block">

  <!-- Unregister legacy sw.js one-time (gated by localStorage) -->
  <script>
    if ('serviceWorker' in navigator) {
      try {
        if (!localStorage.getItem('sw-cleanup-done')) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            var cleaned = false;
            regs.forEach(function(reg) {
              var url = (reg.active && reg.active.scriptURL) || '';
              if (url.indexOf('sw.js') !== -1) {
                reg.unregister();
                cleaned = true;
              }
            });
            localStorage.setItem('sw-cleanup-done', '1');
            if (cleaned) console.log('[App] Unregistered old sw.js');
          });
        }
      } catch (e) {}
    }
  </script>

  <!-- Version polling + cache clearing — detects new deploys, clears stale cache, reloads clean -->
  <script>
    (function() {
      var VERSION_KEY = '_app_version';
      var pollTimer = null;

      async function clearAllCaches() {
        try {
          // Unregister all service workers (old sw.js, Firebase messaging sw)
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            for (var i = 0; i < regs.length; i++) {
              await regs[i].unregister();
            }
          }
        } catch (e) {}
        try {
          if ('caches' in window) {
            var keys = await caches.keys();
            for (var i = 0; i < keys.length; i++) {
              await caches.delete(keys[i]);
            }
          }
        } catch (e) {}
      }

      async function checkVersion() {
        if (document.visibilityState && document.visibilityState !== 'visible') return;
        try {
          var r = await fetch('version.json?_t=' + Date.now(), { cache: 'no-store' });
          var data = await r.json();
          if (!data || data.build == null) return;
          var stored = localStorage.getItem(VERSION_KEY);
          if (!stored) {
            localStorage.setItem(VERSION_KEY, String(data.build));
            return;
          }
          if (parseInt(stored, 10) !== data.build) {
            console.log('[App] New version detected: build ' + data.build + ' — clearing cache and reloading');
            localStorage.setItem(VERSION_KEY, String(data.build));
            await clearAllCaches();
            window.location.reload(true);
          }
        } catch (e) {}
      }

      function startPolling() {
        setTimeout(checkVersion, 3000);
        pollTimer = setInterval(checkVersion, 60000);
      }

      function stopPolling() {
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      }

      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          checkVersion();
          if (!pollTimer) startPolling();
        } else {
          stopPolling();
        }
      });

      startPolling();
    })();
  </script>

  <!-- PWA Install Logic -->
  <script>
    (function() {
      var deferredPrompt = null;
      var overlay = document.getElementById('installOverlay');
      var installBanner = document.getElementById('installBanner');
      var installBtn = document.getElementById('installBtn');
      var installClose = document.getElementById('installClose');
      var DISMISS_KEY = 'pwa-dismissed-at';

      // Check if already installed as PWA
      var isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                         (window.navigator.standalone === true);
      // Check if running in iframe (some browsers don't support standalone check)
      var isIframe = window.self !== window.top;

      // Detect iOS Safari (doesn't support beforeinstallprompt)
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
      var isAppStore = !!window.navigator.standalone; // iOS standalone check

      function shouldShowBanner() {
        // Don't show if already installed
        if (isStandalone || isAppStore || isIframe) return false;
        // Check dismiss timer
        var dismissedAt = localStorage.getItem(DISMISS_KEY);
        if (!dismissedAt) return true;
        var elapsed = Date.now() - parseInt(dismissedAt, 10);
        var oneDay = 24 * 60 * 60 * 1000;
        // Re-prompt after 1 day
        if (elapsed > oneDay) {
          localStorage.removeItem(DISMISS_KEY);
          return true;
        }
        return false;
      }

      function showBanner() {
        if (!shouldShowBanner()) return;
        if (isIOS && isSafari && !isStandalone) {
          installBtn.textContent = 'How to Install';
        }
        overlay.style.display = 'block';
        installBanner.style.display = 'block';
      }

      function dismissBanner() {
        overlay.style.display = 'none';
        installBanner.style.display = 'none';
        localStorage.setItem(DISMISS_KEY, String(Date.now()));
      }

      // ---- Android / Desktop Chrome: native install prompt ----
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        deferredPrompt = e;
        showBanner();
      });

      // ---- Safari iOS: show banner after a short delay ----
      if (isIOS && isSafari && !isStandalone) {
        setTimeout(showBanner, 2500);
      }

      // ---- Button clicks ----
      installBtn.addEventListener('click', function() {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function() {
            deferredPrompt = null;
            dismissBanner();
          });
        } else if (isIOS && isSafari) {
          alert('To install ISKSULARS TRACK:\n\n1. Tap the Share button (square with arrow)\n2. Scroll down and tap "Add to Home Screen"\n3. Tap "Add"');
          dismissBanner();
        }
      });

      installClose.addEventListener('click', dismissBanner);
      overlay.addEventListener('click', dismissBanner);

      // ---- Failsafe show for non-iOS, non-Android (desktop Chrome etc) ----
      if (!isStandalone && !isAppStore && !isIframe && !isIOS) {
        setTimeout(showBanner, 3000);
      }
    })();
  </script>

  <!-- Flutter bootstrap — fade out loading screen when ready -->
  <script>
    var logoLoaded = false;
    var logoImg = new Image();
    logoImg.src = 'icons/isksularstracklogo.png';
    logoImg.onload = function() { logoLoaded = true; };

    function fadeOutLoading() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('fade-out');
        setTimeout(function() { loading.remove(); }, 600);
      }
    }

    window.addEventListener('flutter-first-frame', function() {
      if (logoLoaded) {
        fadeOutLoading();
      } else {
        // Wait for logo to load, then fade out
        logoImg.onload = fadeOutLoading;
      }
    });
    // Failsafe: if Flutter hasn't rendered in 8 seconds, remove the splash
    // anyway so the user isn't stuck on a spinner forever.
    setTimeout(function() {
      var loading = document.getElementById('loading');
      if (loading) {
        console.warn('[App] Loading screen failsafe triggered (8s timeout)');
        loading.classList.add('fade-out');
        setTimeout(function() { loading.remove(); }, 600);
      }
    }, 8000);
  </script>
  <!-- Force fresh JS load: bypass browser cache for flutter_bootstrap.js -->
  <script>
    (function() {
      'use strict';
      // Bust browser cache on flutter_bootstrap.js only
      var s = document.querySelector('script[src*="flutter_bootstrap"]');
      if (s) {
        var sep = s.src.indexOf('?') === -1 ? '?' : '&';
        s.src = s.src + sep + '_cb=' + Date.now();
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>

  <!-- Iframe clickjacking defense (X-Frame-Options header handles the robust side) -->
  <script>
    (function() {
      'use strict';
      if (window.self !== window.top) {
        document.body.innerHTML = '<h1 style="color:red;text-align:center;margin-top:40vh">Access Denied: This app cannot be embedded in an iframe.</h1>';
        return;
      }
    })();
  </script>
</body>
