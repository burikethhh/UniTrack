  <!-- MapLibre GL JS for web map support (loaded synchronously before Flutter) -->
  <script src="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script>
    // Set worker URL immediately — MapLibre is already loaded (synchronous)
    if (typeof maplibregl !== 'undefined') {
      maplibregl.workerUrl = 'https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl-csp-worker.js';

      // ── Suppress MapLibre tile-load errors that flood the console ──
      // MapLibre fires an 'error' event for every failed tile request
      // (404, 403, network timeouts, etc.).  During zoom this creates
      // a "rain" of console errors.  We patch Map.prototype.fire to
      // silently swallow tile/source errors while still letting real
      // application errors through.
      (function() {
        var _origFire = maplibregl.Map.prototype.fire;
        maplibregl.Map.prototype.fire = function(type, properties) {
          if (type === 'error' && properties) {
            var err = properties.error || properties;
            var msg = (err && err.message) ? err.message : String(err);
            // Swallow tile/source HTTP errors (404, 403, network)
            if (msg.indexOf('AJAXError') !== -1 ||
                msg.indexOf('Error loading') !== -1 ||
                msg.indexOf('tile') !== -1 ||
                msg.indexOf('source') !== -1 ||
                (err && (err.status === 404 || err.status === 403))) {
              return this; // swallow silently
            }
          }
          return _origFire.apply(this, arguments);
        };
      })();
    }
  </script>

  <!-- Background tracking helper: Wake Lock + beforeunload beacon -->
  <script src="bg_tracking.js" defer></script>

  <!-- Catch unhandled Promise rejections from MapLibre/maplibre_gl plugin.
       The Flutter maplibre_gl plugin fires async JS calls to add/remove
       annotations.  If a style swap happens mid-flight, the JS side
       rejects with a TypeError that Dart's try-catch cannot catch.
       We suppress these harmless race-condition errors here. -->
  <script>
    window.addEventListener('unhandledrejection', function(event) {
      var reason = event.reason;
      if (reason instanceof TypeError && reason.message) {
        // "Cannot set properties of undefined (setting 'XXXX_N')"
        // "Cannot read properties of undefined (reading 'XXXX')"
        // These are MapLibre annotation-manager errors during style transitions.
        if (/Cannot (set|read) properties of (undefined|null)/.test(reason.message)) {
          event.preventDefault();
          return;
        }
      }
    });
  </script>

  <style>
    /* ===== Global Web Fixes ===== */
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none; /* Prevent iOS Safari bounce */
      -webkit-overflow-scrolling: touch;
      -webkit-tap-highlight-color: transparent;
      /* Prevent text selection of UI elements */
      -webkit-user-select: none;
      user-select: none;
    }

    /* Allow text selection inside inputs/textareas */
    input, textarea, [contenteditable] {
      -webkit-user-select: text;
      user-select: text;
    }

    /* Fix iOS Safari 100vh issue */
    body {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      min-height: 100dvh;
    }
    html { height: -webkit-fill-available; }

    /* Hide scrollbars on the Flutter canvas but keep scroll functionality */
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }

    /* ===== Loading Splash Screen ===== */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 100000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      transition: opacity 0.5s ease-out;
    }
    #loading.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #loading .logo {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      object-fit: cover;
      animation: pulse 2s ease-in-out infinite;
      box-shadow: 0 8px 32px rgba(0, 200, 150, 0.3);
    }
    #loading .app-name {
      margin-top: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }
    #loading .app-tagline {
      margin-top: 6px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: rgba(255,255,255,0.6);
    }
    #loading .spinner {
      margin-top: 36px;
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #00C896;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* ===== PWA Install Banner ===== */
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    #installBanner {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;

      z-index: 99999;

<body>
  <!-- Loading Splash (shown while Flutter engine loads) -->
  <div id="loading">

    <div class="app-tagline">Real-Time Faculty & Staff Locator</div>
    <div class="spinner"></div>
  </div>

  <!-- PWA Install Prompt Banner -->
  <div id="installBanner">
    <div class="install-content">
      <img src="icons/Icon-192.png" alt="iSKSUlars Track" class="install-icon">
      <div class="install-text">
        <p class="install-title">Install iSKSUlars Track</p>
        <p class="install-subtitle">Add to your home screen for quick access</p>
      </div>
      <button class="install-btn" id="installBtn">Install</button>
      <button class="install-close" id="installClose">&times;</button>
    </div>
  </div>

  <!-- Register service worker + auto-update detection -->
  <!-- Flutter's aggressive SW is disabled (--pwa-strategy=none); we use our own -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        // Register immediately — no delay
        navigator.serviceWorker.register('sw.js').then(function(reg) {
          console.log('[App] SW registered');

          // Check for SW updates every 30 seconds (aggressive freshness)
          setInterval(function() {
            reg.update().catch(function() {});
          }, 30 * 1000);

          // Also check when tab regains focus (user returns to app)
          document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible') {
              reg.update().catch(function() {});
            }
          });

          // Detect when a new SW is waiting
          reg.addEventListener('updatefound', function() {
            var newWorker = reg.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', function() {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                console.log('[App] New version detected, activating...');
                newWorker.postMessage('SKIP_WAITING');
              }
            });
          });
        }).catch(function(e) {
          console.warn('[App] SW registration failed:', e);
        });

        // Listen for messages from the SW
        navigator.serviceWorker.addEventListener('message', function(event) {
          if (event.data && event.data.type === 'SW_UPDATED') {
            console.log('[App] SW updated to:', event.data.version);
            // Clear all caches then hard-reload
            caches.keys().then(function(names) {
              return Promise.all(names.map(function(n) { return caches.delete(n); }));
            }).then(function() {
              window.location.reload();
            });
          }
          if (event.data && event.data.type === 'CACHES_CLEARED') {
            console.log('[App] All caches cleared');
            window.location.reload();
          }
        });

        // When a new SW takes over, reload for fresh assets
        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (!refreshing) {
            refreshing = true;
            console.log('[App] New SW controller, reloading...');
            window.location.reload();
          }
        });
      });
    }

    // ── Version polling — catches updates even when SW lifecycle is stuck ──
    // Fetches version.json every 2 minutes; if the version changes, clears
    // caches and reloads. This handles iOS Safari PWAs where SW updates
    // are unreliable, and any other edge-case.
    (function() {
      var knownVersion = null;
      function checkVersion() {
        fetch('version.json?_t=' + Date.now(), { cache: 'no-store' })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (!data || !data.version) return;
            if (knownVersion === null) {
              // First load — just record the current version
              knownVersion = data.version;
              return;
            }
            if (data.version !== knownVersion) {
              console.log('[App] New app version detected via poll:', data.version);
              knownVersion = data.version;
              // Clear SW caches then reload
              caches.keys().then(function(names) {
                return Promise.all(names.map(function(n) { return caches.delete(n); }));
              }).then(function() {
                window.location.reload();
              });
            }
          })
          .catch(function() { /* offline — skip */ });
      }
      // Check on load and every 30 seconds
      setTimeout(checkVersion, 1500);
      setInterval(checkVersion, 30 * 1000);
      // Also check when tab becomes visible
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') checkVersion();
      });
    })();
  </script>

  <!-- PWA Install Logic (Android/Desktop Chrome + iOS Safari fallback) -->
  <script>
    var deferredPrompt = null;
    var installBanner = document.getElementById('installBanner');
    var installBtn = document.getElementById('installBtn');
    var installClose = document.getElementById('installClose');
    var dismissed = localStorage.getItem('pwa-install-dismissed');
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                       window.navigator.standalone === true;

    // Detect iOS Safari
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

    // Android/Desktop: native install prompt
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      if (!dismissed && !isStandalone) {
        setTimeout(function() { installBanner.style.display = 'block'; }, 3000);
      }
    });

    installBtn.addEventListener('click', function() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function() {
          deferredPrompt = null;
          installBanner.style.display = 'none';
        });
      } else if (isIOS) {
        // iOS: show instructions since there's no native install API
        alert('To install iSKSUlars Track:\n\n1. Tap the Share button (square with arrow)\n2. Scroll down and tap "Add to Home Screen"\n3. Tap "Add"');
        installBanner.style.display = 'none';
      }
    });

    installClose.addEventListener('click', function() {
      installBanner.style.display = 'none';
      localStorage.setItem('pwa-install-dismissed', 'true');
    });

    // iOS Safari: show custom banner (no beforeinstallprompt on iOS)
    if (isIOS && isSafari && !isStandalone && !dismissed) {
      setTimeout(function() {
        installBtn.textContent = 'How to Install';
        installBanner.style.display = 'block';
      }, 3000);
    }

    // Never show if already installed
    if (isStandalone) {
      installBanner.style.display = 'none';
    }
  </script>

  <!-- Flutter bootstrap — fade out loading screen when ready -->
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('fade-out');
        setTimeout(function() { loading.remove(); }, 600);
      }
    });
    // Failsafe: if Flutter hasn't rendered in 8 seconds, remove the splash
    // anyway so the user isn't stuck on a spinner forever.
    setTimeout(function() {
      var loading = document.getElementById('loading');
      if (loading) {
        console.warn('[App] Loading screen failsafe triggered (8s timeout)');
        loading.classList.add('fade-out');
        setTimeout(function() { loading.remove(); }, 600);
      }
    }, 8000);
  </script>
  <script src="flutter_bootstrap.js" async></script>

  <!-- Security: Anti-theft protections -->
  <script>
    (function() {
      'use strict';
      // Prevent iframe embedding (clickjacking)
      if (window.self !== window.top) {
        document.body.innerHTML = '<h1 style="color:red;text-align:center;margin-top:40vh">Access Denied: This app cannot be embedded in an iframe.</h1>';
        return;
      }
      // Security protections disabled for debugging
    })();
  </script>
