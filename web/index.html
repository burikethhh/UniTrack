  <!-- MapLibre GL JS for web map support (loaded synchronously before Flutter) -->
  <script src="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script>
    // Set worker URL immediately — MapLibre is already loaded (synchronous)
    if (typeof maplibregl !== 'undefined') {
      maplibregl.workerUrl = 'https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl-csp-worker.js';

      // ── Suppress MapLibre tile-load errors that flood the console ──
      // MapLibre fires an 'error' event for every failed tile request
      // (404, 403, network timeouts, etc.).  During zoom this creates
      // a "rain" of console errors.  We patch Map.prototype.fire to
      // silently swallow tile/source errors while still letting real
      // application errors through.
      (function() {
        var _origFire = maplibregl.Map.prototype.fire;
        maplibregl.Map.prototype.fire = function(type, properties) {
          if (type === 'error' && properties) {
            var err = properties.error || properties;
            var msg = (err && err.message) ? err.message : String(err);
            // Swallow tile/source HTTP errors (404, 403, network)
            if (msg.indexOf('AJAXError') !== -1 ||
                msg.indexOf('Error loading') !== -1 ||
                msg.indexOf('tile') !== -1 ||
                msg.indexOf('source') !== -1 ||
                (err && (err.status === 404 || err.status === 403))) {
              return this; // swallow silently
            }
          }
          return _origFire.apply(this, arguments);
        };
      })();
    }
  </script>

  <!-- Catch unhandled Promise rejections from MapLibre/maplibre_gl plugin.
       The Flutter maplibre_gl plugin fires async JS calls to add/remove
       annotations.  If a style swap happens mid-flight, the JS side
       rejects with a TypeError that Dart's try-catch cannot catch.
       We suppress these harmless race-condition errors here. -->
  <script>
    window.addEventListener('unhandledrejection', function(event) {
      var reason = event.reason;
      if (reason instanceof TypeError && reason.message) {
        // "Cannot set properties of undefined (setting 'XXXX_N')"
        // "Cannot read properties of undefined (reading 'XXXX')"
        // These are MapLibre annotation-manager errors during style transitions.
        if (/Cannot (set|read) properties of (undefined|null)/.test(reason.message)) {
          event.preventDefault();
          return;
        }
      }
    });
  </script>

  <!-- Unregister legacy sw.js one-time (gated by localStorage) -->
  <script>
    if ('serviceWorker' in navigator) {
      try {
        if (!localStorage.getItem('sw-cleanup-done')) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            var cleaned = false;
            regs.forEach(function(reg) {
              var url = (reg.active && reg.active.scriptURL) || '';
              if (url.indexOf('sw.js') !== -1) {
                reg.unregister();
                cleaned = true;
              }
            });
            localStorage.setItem('sw-cleanup-done', '1');
            if (cleaned) console.log('[App] Unregistered old sw.js');
          });
        }
      } catch (e) {}
    }
  </script>

  <!-- Version polling + cache clearing — detects new deploys, clears stale cache, reloads clean -->
  <script>
    (function() {
      var VERSION_KEY = '_app_version';
      var pollTimer = null;

      async function clearAllCaches() {
        try {
          // Unregister all service workers (old sw.js, Firebase messaging sw)
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            for (var i = 0; i < regs.length; i++) {
              await regs[i].unregister();
            }
          }
        } catch (e) {}
        try {
          if ('caches' in window) {
            var keys = await caches.keys();
            for (var i = 0; i < keys.length; i++) {
              await caches.delete(keys[i]);
            }
          }
        } catch (e) {}
      }

      async function checkVersion() {
        if (document.visibilityState && document.visibilityState !== 'visible') return;
        try {
          var r = await fetch('version.json?_t=' + Date.now(), { cache: 'no-store' });
          var data = await r.json();
          if (!data || data.build == null) return;
          var stored = localStorage.getItem(VERSION_KEY);
          if (!stored) {
            localStorage.setItem(VERSION_KEY, String(data.build));
            return;
          }
          if (parseInt(stored, 10) !== data.build) {
            console.log('[App] New version detected: build ' + data.build + ' — clearing cache and reloading');
            localStorage.setItem(VERSION_KEY, String(data.build));
            await clearAllCaches();
            window.location.reload(true);
          }
        } catch (e) {}
      }

      function startPolling() {
        setTimeout(checkVersion, 3000);
        pollTimer = setInterval(checkVersion, 60000);
      }

      function stopPolling() {
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      }

      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          checkVersion();
          if (!pollTimer) startPolling();
        } else {
          stopPolling();
        }
      });

      startPolling();
    })();
  </script>

  <!-- PWA Install Logic (Android/Desktop Chrome + iOS Safari fallback) -->
  <script>
    (function() {
      var deferredPrompt = null;
      var overlay = document.getElementById('installOverlay');
      var installBanner = document.getElementById('installBanner');
      var installBtn = document.getElementById('installBtn');
      var installClose = document.getElementById('installClose');
      var isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                         window.navigator.standalone === true;

      // Detect iOS Safari
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

      // ---- Dismiss persistence: store timestamp, re-show after 3 days ----
      var DISMISS_KEY = 'pwa-install-dismissed-at';
      var BANNER_SHOWN_KEY = 'pwa-banner-shown';

      function shouldShowBanner() {
        if (isStandalone) return false;
        var dismissedAt = localStorage.getItem(DISMISS_KEY);
        if (!dismissedAt) return true;
        var elapsed = Date.now() - parseInt(dismissedAt, 10);
        var threeDays = 3 * 24 * 60 * 60 * 1000;
        return elapsed > threeDays;
      }

      function dismissBanner() {
        localStorage.setItem(DISMISS_KEY, String(Date.now()));
        overlay.style.display = 'none';
        installBanner.style.display = 'none';
      }

      // ---- Show the banner (called when conditions are met) ----
      function showBanner() {
        if (!shouldShowBanner()) return;
        if (localStorage.getItem(BANNER_SHOWN_KEY)) return;
        localStorage.setItem(BANNER_SHOWN_KEY, '1');

        if (isIOS && isSafari) {
          installBtn.textContent = 'How to Install';
        }
        overlay.style.display = 'block';
        installBanner.style.display = 'block';
      }

      // ---- Trigger: user first interaction (scroll 200px or tap) ----
      var interactionDetected = false;

      function onFirstInteraction() {
        if (interactionDetected) return;
        interactionDetected = true;
        showBanner();
      }

      window.addEventListener('scroll', function() {
        if (window.scrollY > 200) onFirstInteraction();
      }, { passive: true });

      document.addEventListener('touchstart', onFirstInteraction, { once: true });
      document.addEventListener('click', onFirstInteraction, { once: true });

      // ---- Also show on beforeinstallprompt if not yet triggered ----
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        deferredPrompt = e;
        if (!interactionDetected) {
          // User hasn't scrolled/tapped yet; show the banner since the OS
          // has signaled installability
          showBanner();
          interactionDetected = true;
        }
      });

      // ---- Button handlers ----
      installBtn.addEventListener('click', function() {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function() {
            deferredPrompt = null;
          });
        } else if (isIOS && isSafari) {
          alert('To install ISKSULARS TRACK:\n\n1. Tap the Share button (square with arrow)\n2. Scroll down and tap "Add to Home Screen"\n3. Tap "Add"');
        }
        overlay.style.display = 'none';
        installBanner.style.display = 'none';
        localStorage.removeItem(BANNER_SHOWN_KEY);
      });

      installClose.addEventListener('click', function() {
        dismissBanner();
        localStorage.removeItem(BANNER_SHOWN_KEY);
      });

      overlay.addEventListener('click', function() {
        dismissBanner();
        localStorage.removeItem(BANNER_SHOWN_KEY);
      });

      // Never show if already installed in standalone mode
      if (isStandalone) {
        overlay.style.display = 'none';
        installBanner.style.display = 'none';
      }
    })();
  </script>

  <!-- Flutter bootstrap — fade out loading screen when ready -->
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('fade-out');
        setTimeout(function() { loading.remove(); }, 600);
      }
    });
    // Failsafe: if Flutter hasn't rendered in 8 seconds, remove the splash
    // anyway so the user isn't stuck on a spinner forever.
    setTimeout(function() {
      var loading = document.getElementById('loading');
      if (loading) {
        console.warn('[App] Loading screen failsafe triggered (8s timeout)');
        loading.classList.add('fade-out');
        setTimeout(function() { loading.remove(); }, 600);
      }
    }, 8000);
  </script>
  <script src="flutter_bootstrap.js" async></script>

  <!-- Iframe clickjacking defense (X-Frame-Options header handles the robust side) -->
  <script>
    (function() {
      'use strict';
      if (window.self !== window.top) {
        document.body.innerHTML = '<h1 style="color:red;text-align:center;margin-top:40vh">Access Denied: This app cannot be embedded in an iframe.</h1>';
        return;
      }
    })();
  </script>
