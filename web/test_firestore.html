<!DOCTYPE html>
<html>
<head>
  <title>Firestore Connection Test</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <style>
    body { font-family: monospace; margin: 20px; background: #1a1a1a; color: #0f0; }
    .pass { color: #0f0; }
    .fail { color: #f00; }
    .info { color: #ff0; }
    #log { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>ISKSULARS TRACK - Firestore Connection Test</h2>
  <p>This page tests if Firestore is reachable from your browser.</p>
  <div id="log"></div>

  <script>
    const logEl = document.getElementById('log');
    function log(msg, cls) {
      const span = document.createElement('span');
      span.className = cls || '';
      span.textContent = msg + '\n';
      logEl.appendChild(span);
      console.log(msg);
    }

    async function runTests() {
      try {
        // Test 1: Initialize Firebase
        log('Test 1: Initializing Firebase...', 'info');
        const app = firebase.initializeApp({
          apiKey: 'AIzaSyBhSl-KJ5bF3CtsYfm1etcwHNCgyGsSAo8',
          authDomain: 'isksulars-track.firebaseapp.com',
          projectId: 'isksulars-track',
          storageBucket: 'isksulars-track.firebasestorage.app',
          messagingSenderId: '505882301770',
          appId: '1:505882301770:web:d5d1c0e7b3d6b17f9c9db3',
        }, 'test-app');
        log('  PASS: Firebase initialized', 'pass');

        // Test 2: Get Firestore instance
        log('\nTest 2: Getting Firestore instance...', 'info');
        const db = firebase.firestore(app);
        log('  PASS: Firestore instance created', 'pass');

        // Test 3: Try to write a test document
        log('\nTest 3: Writing test document to Firestore...', 'info');
        const startTime = Date.now();
        try {
          await db.collection('_connection_test').doc('browser-test').set({
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            userAgent: navigator.userAgent,
            testId: Math.random().toString(36).substring(7),
          }, { merge: true });
          const elapsed = Date.now() - startTime;
          log(`  PASS: Write successful (${elapsed}ms)`, 'pass');
        } catch (writeErr) {
          const elapsed = Date.now() - startTime;
          log(`  FAIL: Write failed after ${elapsed}ms: ${writeErr.message}`, 'fail');
        }

        // Test 4: Try to read the document back
        log('\nTest 4: Reading test document from Firestore...', 'info');
        const readStart = Date.now();
        try {
          const doc = await db.collection('_connection_test').doc('browser-test').get();
          const elapsed = Date.now() - readStart;
          if (doc.exists) {
            log(`  PASS: Read successful (${elapsed}ms) - data: ${JSON.stringify(doc.data())}`, 'pass');
          } else {
            log(`  FAIL: Document does not exist after write`, 'fail');
          }
        } catch (readErr) {
          const elapsed = Date.now() - readStart;
          log(`  FAIL: Read failed after ${elapsed}ms: ${readErr.message}`, 'fail');
        }

        // Test 5: Try to read users collection (requires auth)
        log('\nTest 5: Attempting to read users collection (no auth)...', 'info');
        try {
          const snap = await db.collection('users').limit(1).get();
          log(`  PASS: Read users collection (${snap.size} docs)`, 'pass');
        } catch (usersErr) {
          log(`  Expected error (no auth): ${usersErr.message}`, 'info');
        }

        log('\n--- All tests complete ---', 'info');
        log('If Test 3 or 4 fails, your browser is blocking Firestore.', 'info');

      } catch (err) {
        log(`\nFATAL ERROR: ${err.message}`, 'fail');
        log(err.stack, 'fail');
      }
    }

    runTests();
  </script>
</body>
</html>
