<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Vibrant Emerald Pin Gradient -->
    <linearGradient id="pin-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5b8" />
      <stop offset="100%" stop-color="#00c896" />
    </linearGradient>

    <!-- Subtle Glow -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Adaptive Icon Foreground - Slightly larger to fill mask -->
  <g filter="url(#glow)" transform="translate(0, -10)">
    <!-- Pin Shape - Scaled up to fill adaptive mask better -->
    <path d="M256 60 C174 60 110 124 110 206 C110 320 256 400 256 400 C256 400 402 320 402 206 C402 124 338 60 256 60 Z" 
          fill="url(#pin-grad)" />
    
    <!-- Person Silhouette -->
    <g fill="#0a2540">
      <!-- Head -->
      <circle cx="256" cy="140" r="34" />
      
      <!-- Shoulders -->
      <path d="M256 192 C194 192 154 232 146 290 C160 298 180 302 204 304 L308 304 C332 302 352 298 366 290 C358 232 318 192 256 192 Z" />
      
      <!-- V-neck -->
      <path d="M230 192 L256 238 L282 192 Z" fill="url(#pin-grad)" />
      
      <!-- ID Badge -->
      <rect x="242" y="248" width="28" height="36" rx="6" fill="url(#pin-grad)" />
      <circle cx="256" cy="258" r="5" fill="#0a2540" />
      <rect x="246" y="273" width="20" height="4" rx="2" fill="#0a2540" opacity="0.6" />
    </g>
  </g>

  <!-- Tracking dots -->
  <circle cx="160" cy="85" r="6" fill="#4DFFD6" opacity="0.8" />
  <circle cx="350" cy="270" r="8" fill="#00f5b8" opacity="0.6" />
</svg>
