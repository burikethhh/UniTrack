<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pin-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E6A8" />
      <stop offset="100%" stop-color="#009E75" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Foreground-only icon for Android adaptive masks (transparent background) -->
  <g filter="url(#glow)">
    <!-- Outer pulse -->
    <path d="M256 70 C185 70 126 129 126 200 C126 302 256 358 256 358 C256 358 386 302 386 200 C386 129 327 70 256 70 Z" fill="url(#pin-grad)" opacity="0.25" />

