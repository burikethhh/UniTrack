    <path d="M256 88 C196 88 148 136 148 196 C148 266 206 314 256 346 C306 314 364 266 364 196 C364 136 316 88 256 88 Z" fill="url(#pin-grad)" />

    <!-- Staff silhouette + ID badge -->
    <g fill="#1a1a2e">
      <circle cx="256" cy="146" r="28" />
      <path d="M256 188 C212 188 182 220 176 262 C187 267 199 270 212 272 L300 272 C313 270 325 267 336 262 C330 220 300 188 256 188 Z" />
      <path d="M236 188 L256 218 L276 188 Z" fill="url(#pin-grad)" />
      <rect x="246" y="224" width="20" height="28" rx="4" fill="url(#pin-grad)" />
      <circle cx="256" cy="230" r="3" fill="#1a1a2e" />
    </g>
